# Render Blueprint — https://render.com/docs/blueprint-spec
# In the Render dashboard: New → Blueprint → select this repo. Render reads this file
# and proposes both services below; envVars marked `sync: false` prompt you for the
# value during setup (secrets are never stored in this file/repo).
services:
  - type: web
    name: financeledgerpro-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./src/FinanceLedger.API/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__Postgres
        sync: false
      - key: Supabase__Url
        sync: false
      - key: Supabase__AnonKey
        sync: false
      - key: Supabase__ServiceRoleKey
        sync: false
      - key: Supabase__StorageBucket
        value: attachments
      - key: Resend__ApiKey
        sync: false
      - key: Resend__SenderAddress
        sync: false
      - key: Cors__Origins__0
        sync: false
      - key: GoogleSheets__SpreadsheetId
        sync: false
      - key: GoogleSheets__SheetName
        value: Transactions

  - type: worker
    name: financeledgerpro-worker
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./src/FinanceLedger.Worker/Dockerfile
    dockerContext: .
    envVars:
      - key: DOTNET_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__Postgres
        sync: false
      - key: Supabase__Url
        sync: false
      - key: Supabase__AnonKey
        sync: false
      - key: Supabase__ServiceRoleKey
        sync: false
      - key: Supabase__StorageBucket
        value: attachments
      - key: GoogleSheets__SpreadsheetId
        sync: false
      - key: GoogleSheets__SheetName
        value: Transactions
      - key: GoogleSheets__CredentialsJson
        sync: false
      - key: Sync__IntervalMinutes
        value: "15"
      - key: Sync__Enabled
        value: "true"
