name: Deploy Infrastructure (Bicep)

# Validates and deploys the Bicep templates to a resource group.
# Triggers on changes to infra/bicep/** or manually with an env choice.

on:
  push:
    branches: [main]
    paths:
      - 'infra/bicep/**'
      - '.github/workflows/infra.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  id-token: write
  contents: read

env:
  TEMPLATE_FILE: infra/bicep/main.bicep

jobs:
  deploy:
    name: az deployment group create
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve environment
        id: vars
        run: |
          ENV="${{ github.event.inputs.environment || 'dev' }}"
          echo "env=$ENV" >> "$GITHUB_OUTPUT"
          echo "rg=rg-financeledger-$ENV" >> "$GITHUB_OUTPUT"
          echo "params=infra/bicep/main.parameters.$ENV.json" >> "$GITHUB_OUTPUT"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure resource group exists
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az group create \
              --name "${{ steps.vars.outputs.rg }}" \
              --location "${{ vars.AZURE_LOCATION || 'eastus' }}"

      - name: What-If (preview changes)
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          resourceGroupName: ${{ steps.vars.outputs.rg }}
          template: ${{ env.TEMPLATE_FILE }}
          parameters: ${{ steps.vars.outputs.params }}
          additionalArguments: --what-if

      - name: Deploy Bicep
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          resourceGroupName: ${{ steps.vars.outputs.rg }}
          template: ${{ env.TEMPLATE_FILE }}
          parameters: ${{ steps.vars.outputs.params }}
          deploymentName: financeledger-${{ steps.vars.outputs.env }}-${{ github.run_number }}
          failOnStdErr: false
