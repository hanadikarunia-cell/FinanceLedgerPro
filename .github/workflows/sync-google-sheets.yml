name: Sync approved transactions to Google Sheets

# Stands in for a dedicated always-on worker process: Render's free tier has no
# Background Worker instance type, so this calls the API's admin-triggered sync
# endpoint on an interval instead of paying for a separate service that would run
# the exact same logic continuously. As a side effect, this also periodically wakes
# the free API from Render's inactivity spin-down.
#
# DISABLED (no schedule): the sync pushes to one global spreadsheet, so with several sites it
# could send one site's data into another site's sheet. Re-enable only together with a
# per-site spreadsheet setting. It can still be run by hand from the Actions tab.
on:
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Log in and trigger sync
        env:
          API_BASE_URL: ${{ secrets.SYNC_API_BASE_URL }}
          SYNC_USER_EMAIL: ${{ secrets.SYNC_USER_EMAIL }}
          SYNC_USER_PASSWORD: ${{ secrets.SYNC_USER_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${API_BASE_URL:-}" ]; then
            echo "SYNC_API_BASE_URL secret is not set; skipping this run."
            exit 0
          fi

          token=$(curl -sf -X POST "$API_BASE_URL/api/v1/auth/login" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"$SYNC_USER_EMAIL\",\"password\":\"$SYNC_USER_PASSWORD\"}" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['accessToken'])")

          curl -sf -X POST "$API_BASE_URL/api/v1/admin/sync/google-sheets" \
            -H "Authorization: Bearer $token" \
            -H "Content-Length: 0"
