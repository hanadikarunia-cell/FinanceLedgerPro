name: App Service CI/CD

# Builds & tests the .NET 8 API and the React web app, then deploys both to
# Azure App Service using OIDC (federated credentials) — no publish profiles.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # required for OIDC login to Azure
  contents: read

env:
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '20'
  SOLUTION: FinanceLedgerPro.sln
  API_PROJECT: src/FinanceLedger.API/FinanceLedger.API.csproj
  WEB_DIR: src/FinanceLedger.Web

jobs:
  # ---------------------------------------------------------------------------
  build-api:
    name: Build & test API (.NET 8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} --configuration Release --no-restore

      - name: Test
        run: dotnet test ${{ env.SOLUTION }} --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Publish
        run: dotnet publish ${{ env.API_PROJECT }} --configuration Release --no-build --output ${{ github.workspace }}/publish/api

      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: api
          path: ${{ github.workspace }}/publish/api

  # ---------------------------------------------------------------------------
  build-web:
    name: Build React web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.WEB_DIR }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.WEB_DIR }}
        run: npm ci

      - name: Build
        working-directory: ${{ env.WEB_DIR }}
        env:
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: npm run build

      - name: Test
        working-directory: ${{ env.WEB_DIR }}
        run: npm test --if-present -- --watchAll=false

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web
          # This repo uses Vite -> dist/. (CRA would be build/.)
          path: ${{ env.WEB_DIR }}/dist

  # ---------------------------------------------------------------------------
  deploy-api:
    name: Deploy API to App Service
    runs-on: ubuntu-latest
    needs: [build-api]
    environment: production
    steps:
      - name: Download API artifact
        uses: actions/download-artifact@v4
        with:
          name: api
          path: ./api

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App (API)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_API_APP_NAME }}
          package: ./api

  # ---------------------------------------------------------------------------
  deploy-web:
    name: Deploy web to App Service
    runs-on: ubuntu-latest
    needs: [build-web]
    environment: production
    steps:
      - name: Download web artifact
        uses: actions/download-artifact@v4
        with:
          name: web
          path: ./web

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App (web)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEB_APP_NAME }}
          package: ./web
